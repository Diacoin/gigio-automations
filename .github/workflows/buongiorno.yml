name: Buongiorno MarcoMan

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  send-buongiorno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Invia buongiorno su Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 send_buongiorno.py
