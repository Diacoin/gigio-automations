name: Buongiorno MarcoMan

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  send-buongiorno:
    runs-on: ubuntu-latest
    steps:
      - name: Invia buongiorno su Telegram
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage             -H "Content-Type: application/json"             -d "{\"chat_id\":${{ secrets.TELEGRAM_CHAT_ID }},\"text\":\"Buongiorno MarcoMan! Sono Kirk. Buona giornata e buon lavoro! - BitsLegacy\"}"
