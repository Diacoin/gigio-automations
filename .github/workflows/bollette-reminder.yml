name: Promemoria Bollette Sorgenia

on:
  schedule:
    - cron: "0 7 2 * *"  # ogni 2° del mese alle 09:00 CET (07:00 UTC)
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Recupera bollette e invia promemoria Telegram
        env:
          SORGENIA_REFRESH_TOKEN: ${{ secrets.SORGENIA_REFRESH_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SORGENIA_GH_PAT: ${{ secrets.SORGENIA_GH_PAT }}
        run: node scripts/bollette-check.js

      - name: Aggiorna refresh token su GitHub Secrets
        if: env.NEW_SORGENIA_RT != ''
        env:
          GH_TOKEN: ${{ secrets.SORGENIA_GH_PAT }}
        run: |
          echo "$NEW_SORGENIA_RT" | gh secret set SORGENIA_REFRESH_TOKEN --repo Diacoin/gigio-automations
          echo "Refresh token aggiornato"
